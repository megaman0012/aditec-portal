<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal ADITEC — Ingreso</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="pagina-login">
  <main class="login-caja">
    <form class="login-tarjeta" id="form-login" autocomplete="on" novalidate>
      <img src="/img/logo.svg" alt="ADITEC" class="login-logo">
      <h1>ADITEC ECUATORIANA</h1>
      <p class="sub">Portal interno · Rentabilidad por empleado</p>
      <label class="campo">Usuario
        <input name="usuario" id="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label class="campo">Contraseña
        <input name="password" id="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="login-error" id="login-error" role="alert" hidden></p>
      <button type="submit" class="boton primario" id="btn-ingresar">Ingresar</button>
      <p class="muted pie">Acceso solo desde la red interna.</p>
    </form>
  </main>
  <script src="/login.js"></script>
</body>
</html>
